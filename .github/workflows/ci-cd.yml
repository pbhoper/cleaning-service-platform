name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend
        run: |
          cd backend
          npm ci --ignore-scripts
          npm run eslint:run
          npm run build

      - name: Frontend
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm run lint
          npm run build

  docker-build:
    needs: lint-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker
        run: |
          docker build -t cleaning-platform:latest .